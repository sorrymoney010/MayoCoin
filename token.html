<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MayoCoin wallet</title>
  <link rel="icon" href="assets/token.svg" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/hq.css" />
</head>
<body>
  <header>
    <div class="wrap nav">
      <a class="logo" href="index.html">MayoCoin</a>
      <div class="nav-links">
        <a href="index.html#coin">Coin</a>
        <a href="index.html#map">Map</a>
        <a href="index.html#fund">Fund</a>
        <a href="token.html">Wallet</a>
      </div>
    </div>
  </header>
  <section style="padding-top:48px">
    <div class="wrap">
      <div class="kicker">Wallet</div>
      <h2>Add MAYO on Base</h2>
      <div class="bag">
        <div class="label">Official contract</div>
        <div class="ca" data-ca>0x1775A38Cd04f1Da9Ec35D205491fE71DeA90aFF9</div>
        <div class="row">
          <button class="btn-light" type="button" id="addBaseBtn">Add Base to MetaMask</button>
          <button class="btn-dark" type="button" id="addTokenBtn">Add MAYO to MetaMask</button>
          <button class="btn-dark" type="button" data-copy-ca>Copy CA</button>
        </div>
        <p class="note">Chain ID 8453. If the name is not MayoCoin / MAYO, you have the wrong contract. No pool yet.</p>
      </div>
    </div>
  </section>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/wallet.js"></script>
</body>
</html>
